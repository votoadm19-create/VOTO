<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Voto</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="top">
      <div class="in">
        <div class="row1">
          <a class="brand" href="#sobre" aria-label="Voto, sobre a empresa"
            ><img
              src="imgs/logo/voto-logo.png"
              alt="Voto"
              width="112"
              height="28"
          /></a>
          <label class="search"
            ><svg
              class="ic"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-4-4" /></svg
            ><input
              id="q"
              type="search"
              placeholder="Buscar na Voto"
              autocomplete="off"
              aria-label="Buscar produtos"
          /></label>
          <button
            class="themebtn"
            id="themebtn"
            type="button"
            data-a="theme"
            aria-label="Ativar modo escuro"
            title="Modo escuro"
          >
            <svg
              class="ic"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z" />
            </svg>
          </button>
          <a class="accountbtn" id="accountbtn" href="#conta" aria-label="Minha conta"
            ><svg
              class="ic"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="8" r="3.6" />
              <path d="M4.5 20a7.5 7.5 0 0115 0" /></svg
          ></a>
          <a class="cartbtn" href="#carrinho" aria-label="Carrinho"
            ><svg
              class="ic"
              width="26"
              height="26"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 4h2l2.4 11h10.2L20 8H6.2" />
              <circle cx="9" cy="19" r="1.5" />
              <circle cx="17" cy="19" r="1.5" /></svg
            ><b class="badge" id="badge"></b
          ></a>
        </div>
        <div class="row2">
          <svg
            class="ic"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z" />
            <circle cx="12" cy="10" r="2.5" />
          </svg>
          <label
            >Entregar em
            <select id="cidade" aria-label="Cidade de entrega">
              <option>Jundiaí</option>
              <option>Várzea Paulista</option>
            </select></label
          >
        </div>
        <div
          class="tabs"
          id="tabs"
          role="tablist"
          aria-label="Categorias"
        ></div>
        <div class="navtop" id="navtop"></div>
      </div>
    </header>

    <main id="app"></main>
    <footer id="foot"></footer>

    <nav id="nav" aria-label="Menu principal">
      <div class="in" id="navin"></div>
    </nav>
    <div id="toast" role="status" aria-live="polite"></div>

    <script src="/api/config.js"></script>
    <script src="/api/products.js"></script>
    <script src="script.js"></script>
  </body>
</html>
